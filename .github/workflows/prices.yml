name: Update price lists

on:
  schedule:
    # 09:17 Singapore time every day; data is only committed when a list changed.
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/fetch.mjs'
      - 'pipeline/sources.json'
      - '.github/workflows/prices.yml'

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch price lists
        run: node pipeline/fetch.mjs
      - name: Commit changes
        run: |
          git config user.name "sgpc-bot"
          git config user.email "sgpc-bot@users.noreply.github.com"
          git add -A data pipeline/sources.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update price lists"
            git pull --rebase origin main
            git push
          fi
